eureka.client.enabled=false

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://*,https://*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true

auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8086}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://auth-service:8086}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthFilter

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthFilter

spring.cloud.gateway.server.webflux.routes[2].id=course-service
spring.cloud.gateway.server.webflux.routes[2].uri=${COURSE_SERVICE_URL:http://course-service:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/courses/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthFilter

spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=${PAYMENT_SERVICE_URL:http://payment-service:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthFilter

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthFilter

spring.cloud.gateway.server.webflux.routes[5].id=review-service
spring.cloud.gateway.server.webflux.routes[5].uri=${REVIEW_SERVICE_URL:http://review-service:8087}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/reviews/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthFilter

jwt.public-paths=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/validate
