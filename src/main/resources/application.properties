spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# JWT configuration
jwt.public-paths=/api/auth/register,/api/auth/login,/api/auth/refresh,/api/auth/validate

# Routes
# auth-service ? MIXED: auth entrypoint are public, role/user management is protected
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthFilter

# user-service ? PROTECTED
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthFilter

# course-service ? MIXED (public browse + protected enroll/create)
# One route handles all; your AuthFilter passes public GETs through.
spring.cloud.gateway.server.webflux.routes[2].id=course-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://course-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/courses/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthFilter

# payment-service ? PROTECTED
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthFilter

# notification-service ? PROTECTED
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthFilter

# review-service ? PROTECTED
spring.cloud.gateway.server.webflux.routes[5].id=review-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://review-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/reviews/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthFilter

# semantic-search-service ? PUBLIC (no auth for search)
spring.cloud.gateway.server.webflux.routes[6].id=semantic-search-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://semantic-search-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/nlu/**
